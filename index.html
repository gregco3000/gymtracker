<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Logger</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f7f7f7;
  margin: 0;
  padding: 16px;
}

h1, h2 {
  text-align: center;
  margin: 8px 0;
}

.hidden { display: none; }

button {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: none;
  border-radius: 16px;
  background: #111;
  color: #fff;
  font-size: 16px;
}

button.secondary {
  background: #555;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.card img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  border-radius: 16px;
  background: #eee;
  margin-bottom: 8px;
}

.exercise-title {
  font-weight: 600;
  margin-bottom: 6px;
}

.inputs {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

input {
  width: 60px;
  padding: 6px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.set-label {
  font-size: 13px;
  margin-bottom: 6px;
}
</style>
</head>

<body>

<!-- ================= LANDING ================= -->

<div id="landing">
  <h1>Next Workout</h1>
  <h2 id="nextWorkout"></h2>

  <button type="button" onclick="startRoutine('Chest & Triceps')">Chest & Triceps</button>
  <button type="button" onclick="startRoutine('Back & Biceps')">Back & Biceps</button>
  <button type="button" onclick="startRoutine('Legs & Shoulders')">Legs & Shoulders</button>
</div>

<!-- ================= WORKOUT ================= -->

<div id="workout" class="hidden">
  <h1 id="routineTitle"></h1>
  <div id="exerciseContainer"></div>
  <button class="secondary" type="button" onclick="completeWorkout()">Complete Workout</button>
</div>

<script>
/* ================= CONFIG ================= */

const API_URL = "https://script.google.com/macros/s/AKfycbxlqwIx5reDGwW0EdYEdMzUccwHewLgV_6VxFbw8biY8VQRmF9J-QVlmf1DpPvKfYwxSw/exec";
const SECRET = "version2";

const routineOrder = [
  "Chest & Triceps",
  "Back & Biceps",
  "Legs & Shoulders"
];

const routines = {
  "Chest & Triceps": [
    ["Dumbbell Bench Press","dumbbell_bench_press.png"],
    ["Incline Bench Press","incline_bench_press.png"],
    ["Bench Dip","bench_dip.png"],
    ["Dumbbell Fly","dumbbell_fly.png"],
    ["Overhead Tricep Extension","overhead_tricep_ext.png"],
    ["Rope Tricep Pushdown","rope_tricep_ext.png"]
  ],
  "Back & Biceps": [
    ["Lat Pulldown","lat_pulldown.png"],
    ["Seated Cable Row","seated_cable_row.png"],
    ["One Arm Dumbbell Row","one_arm_db_row.png"],
    ["Dumbbell Deadlift","dumbbell_deadlift.png"],
    ["Hammer Curls","hammer_curl.png"],
    ["Cable Curls","cable_curl.png"]
  ],
  "Legs & Shoulders": [
    ["Leg Press","leg_press.png"],
    ["Leg Extensions","leg_extension.png"],
    ["Leg Curls","leg_curl.png"],
    ["Calf Raises","calf_raise.png"],
    ["Machine Shoulder Press","machine_shoulder_press.png"],
    ["Lateral Raises","lateral_raise.png"]
  ]
};

let activeRoutine = null;

/* ================= LANDING ================= */

function getNextRoutine() {
  const last = localStorage.getItem("lastRoutine");
  if (!last) return routineOrder[0];
  return routineOrder[(routineOrder.indexOf(last) + 1) % routineOrder.length];
}

document.getElementById("nextWorkout").textContent = getNextRoutine();

/* ================= WORKOUT ================= */

function startRoutine(name) {
  activeRoutine = name;

  document.getElementById("landing").classList.add("hidden");
  document.getElementById("workout").classList.remove("hidden");
  document.getElementById("routineTitle").textContent = name;

  const container = document.getElementById("exerciseContainer");
  container.innerHTML = "";

  routines[name].forEach(([exercise, img]) => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.exercise = exercise;
    card.dataset.set = "1";

    card.innerHTML = `
      <img src="icons/exercises/${img}">
      <div class="exercise-title">${exercise}</div>
      <div class="set-label">Set 1</div>
      <div class="inputs">
        <input type="number" inputmode="numeric" placeholder="Weight">
        <input type="number" inputmode="numeric" placeholder="Reps">
      </div>
      <button type="button" onclick="recordSet(this)">Record</button>
    `;

    container.appendChild(card);
  });
}

function completeWorkout() {
  localStorage.setItem("lastRoutine", activeRoutine);
  activeRoutine = null;

  document.getElementById("workout").classList.add("hidden");
  document.getElementById("landing").classList.remove("hidden");
  document.getElementById("nextWorkout").textContent = getNextRoutine();
}

/* ================= LOGGING ================= */

function recordSet(btn) {
  if (!activeRoutine) {
    alert("No active routine selected.");
    return;
  }

  const card = btn.closest(".card");
  const inputs = card.querySelectorAll("input");

  const weight = Number(inputs[0].value);
  const reps = Number(inputs[1].value);
  const set = Number(card.dataset.set);
  const exercise = card.dataset.exercise;

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      secret: SECRET,
      routine: activeRoutine,
      exercise: exercise,
      set: set,
      weight: weight,
      reps: reps
    })
  });

  card.dataset.set = String(set + 1);
  card.querySelector(".set-label").textContent =
    set + 1 <= 6 ? `Set ${set + 1}` : "Done";

  inputs[0].value = "";
  inputs[1].value = "";

  if (set + 1 > 6) btn.disabled = true;
}
</script>

</body>
</html>
