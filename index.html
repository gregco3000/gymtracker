<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Workout Tracker</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 12px;
    background: #ffffff;
    color: #000;
  }

  h1 {
    font-size: 26px;
    margin-bottom: 10px;
    text-align: center;
  }

  button {
    width: 100%;
    padding: 14px;
    margin: 6px 0;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    color: #fff;
  }

  .start-btn { background: #28a745; }
  .finish-btn { background: #dc3545; }

  .exercise-card {
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 18px;
  }

  .exercise-title {
    font-size: 20px;
    margin-bottom: 6px;
  }

  .exercise-image {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    border-radius: 12px;
    background: #f5f5f5;
    margin-bottom: 10px;
  }

  .set-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .set-label {
    min-width: 60px;
    font-size: 16px;
  }

  input {
    width: 90px;
    padding: 8px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .record-btn {
    flex: 1;
    background: #007AFF;
    font-size: 18px;
    border-radius: 10px;
  }

  .record-btn:disabled {
    background: #bbb;
  }
</style>
</head>

<body>

<!-- HEADER -->
<h1 id="nextWorkoutTitle">Next Workout</h1>
<button class="start-btn" onclick="startWorkout()">START WORKOUT</button>
<button class="finish-btn" onclick="finishWorkout()">FINISH WORKOUT</button>

<!-- WORKOUT CONTENT -->
<div id="workoutContent" style="display:none;"></div>

<script>
/* ================= CONFIG ================= */

const API_URL = "https://script.google.com/macros/s/AKfycbxp5-dbIgYGIBoD_ufCTc7CRcSjMrAKS9-UmzpObPIl0-oQyxnXcDg3iIFlc0wg1j_0AQ/exec";
const SECRET = "version2";
const MAX_SETS = 6;

/* ================= WORKOUT DATA ================= */

const workouts = [
  {
    name: "Workout 1 – Chest and Triceps",
    exercises: [
      {
        name: "Dumbbell Bench Press",
        target: 12,
        image: "icons/exercises/dumbell_bench_press.png"
      }
    ]
  },
  {
    name: "Workout 2 – Back and Biceps",
    exercises: []
  },
  {
    name: "Workout 3 – Legs and Shoulders",
    exercises: []
  }
];

/* ================= STATE ================= */

let currentWorkoutIndex = 0;

if (localStorage.getItem("lastWorkoutIndex")) {
  currentWorkoutIndex = Number(localStorage.getItem("lastWorkoutIndex"));
}

/* ================= INIT ================= */

updateTitle();

/* ================= FUNCTIONS ================= */

function updateTitle() {
  document.getElementById("nextWorkoutTitle").innerText =
    "Next Workout: " + workouts[currentWorkoutIndex].name;
}

function startWorkout() {
  document.getElementById("workoutContent").style.display = "block";
  renderWorkout();
}

function finishWorkout() {
  localStorage.setItem("lastWorkoutIndex", currentWorkoutIndex);

  currentWorkoutIndex++;
  if (currentWorkoutIndex >= workouts.length) {
    currentWorkoutIndex = 0;
  }

  document.getElementById("workoutContent").style.display = "none";
  document.getElementById("workoutContent").innerHTML = "";

  updateTitle();
  alert("Workout complete 💪");
}

function renderWorkout() {
  const container = document.getElementById("workoutContent");
  container.innerHTML = "";

  workouts[currentWorkoutIndex].exercises.forEach(ex => {
    ex.currentSet = 1;

    const card = document.createElement("div");
    card.className = "exercise-card";

    const title = document.createElement("div");
    title.className = "exercise-title";
    title.innerText = `${ex.name} (Target: ${ex.target})`;

    const img = document.createElement("img");
    img.src = ex.image;
    img.className = "exercise-image";

    const setRow = document.createElement("div");
    setRow.className = "set-row";

    const setLabel = document.createElement("div");
    setLabel.className = "set-label";
    setLabel.innerText = "Set 1";

    const weightInput = document.createElement("input");
    weightInput.type = "number";
    weightInput.placeholder = "Weight";

    const repsInput = document.createElement("input");
    repsInput.type = "number";
    repsInput.placeholder = "Reps";

    const recordBtn = document.createElement("button");
    recordBtn.className = "record-btn";
    recordBtn.innerText = "Record";

    recordBtn.onclick = () => {
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          secret: SECRET,
          day: new Date().toDateString(),
          routine: workouts[currentWorkoutIndex].name,
          exercise: ex.name,
          set: ex.currentSet,
          weight: weightInput.value,
          reps: repsInput.value
        })
      }).then(() => {
        ex.currentSet++;
        weightInput.value = "";
        repsInput.value = "";

        if (ex.currentSet > MAX_SETS) {
          recordBtn.disabled = true;
          weightInput.disabled = true;
          repsInput.disabled = true;
          setLabel.innerText = "Completed ✅";
        } else {
          setLabel.innerText = "Set " + ex.currentSet;
        }
      });
    };

    setRow.append(setLabel, weightInput, reps
